<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>콜라 판화 성장수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 판화실 선생님의 다정하고 또렷한 안내, 교실 화면에서도 잘 보이게
   IDEA: 은박 판과 판화지 — 슬라이드 한 장이 찍어낸 판화 한 장처럼
   PICTURE: 은박 판 위에 찍힌 상징, 롤러, 콜라 방울 / 원리 단면도
   COLOUR and TYPE: 판화지 흰 바탕, 먹 검정, 은박 회색, 콜라 레드 포인트 / Black Han Sans + Noto Sans KR
   LAYOUT: 상단 바, 왼쪽 목차(다시 찾기), 가운데 큰 슬라이드, 아래 이동 버튼 */
:root{color-scheme:light dark;
--bg:light-dark(#f3f2ee,#141312);--paper:light-dark(#ffffff,#1e1d1b);--ink:light-dark(#1c1b19,#f1efe9);
--soft:light-dark(#5d5a54,#b9b5ac);--line:light-dark(#dedbd3,#34322e);--foil:light-dark(#e6e7e9,#2b2d30);
--red:light-dark(#c8202f,#ff5a63);--blue:light-dark(#1f6f8b,#5cc0de);--ok:light-dark(#18794e,#4fd18b);--no:light-dark(#b42318,#ff7b6e);
--g:var(--red)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body.g2{--g:light-dark(#1f6f8b,#5cc0de)}body.g3{--g:light-dark(#7a3fa0,#c59bf0)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all}
h1,h2,h3{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
button,input,a.btn{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(2vw,12px);background:var(--ink);color:var(--paper)}
.top .brand{font-family:"Black Han Sans";font-size:20px;background:none;border:0;color:inherit;padding:8px 6px;min-height:44px}
.top .sp{flex:1}
.tb{min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--paper) 40%,transparent);background:transparent;color:var(--paper);font-weight:700}
.tb[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.tb.icon{padding:6px 12px}
/* 홈 */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(28px,5vw,72px) max(5vw,16px) 24px;max-width:1240px;margin:auto}
.hero h1{font-size:clamp(40px,6vw,68px)}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--soft);font-size:18px;max-width:34em}
.hero .fig{aspect-ratio:5/4}
.hero svg{width:100%;height:100%;display:block}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1240px;margin:0 auto;padding:8px max(5vw,16px) 56px}
.pick{display:block;text-align:left;border:0;border-radius:20px;padding:28px;background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line),0 10px 30px -18px #0006;border-top:10px solid var(--c);transition:transform .2s}
.pick:hover{transform:translateY(-4px)}
.pick .gr{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:15px}
.pick h2{font-size:clamp(28px,3.4vw,40px);margin:14px 0 8px}
.pick p{margin:0 0 14px;color:var(--soft)}
.pick .go{font-weight:900;color:var(--c)}
.homeinfo{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px) 56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.homeinfo div{border-top:2px solid var(--ink);padding-top:10px}
.homeinfo b{display:block;font-size:15px}
.homeinfo span{color:var(--soft);font-size:15px}
/* 수업 화면 */
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.toc{background:var(--paper);border-right:1px solid var(--line);padding:16px 10px 40px;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}
.toc h3{font-size:15px;font-family:"Noto Sans KR";font-weight:900;color:var(--g);margin:14px 8px 6px}
.toc button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:10px;font-size:15px;min-height:40px;align-items:center}
.toc button i{font-style:normal;color:var(--soft);font-size:13px;width:20px;flex:none}
.toc button.on{background:var(--g);color:#fff}
.toc button.on i{color:#fff}
.stage{display:flex;flex-direction:column;padding:clamp(12px,2vw,28px);gap:14px}
.slide{flex:1;background:var(--paper);border-radius:22px;padding:clamp(22px,3.4vw,52px);box-shadow:0 1px 0 var(--line),0 18px 50px -30px #0007;position:relative;overflow:hidden;animation:pull .45s ease}
@keyframes pull{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.pick{transition:none}}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;background:var(--foil);color:var(--ink)}
.chip.g{background:var(--g);color:#fff}
.slide h2{font-size:clamp(30px,4vw,50px);margin-bottom:18px}
.slide h2 small{display:block;font-family:"Noto Sans KR";font-weight:500;font-size:clamp(16px,1.6vw,20px);color:var(--soft);margin-top:10px}
.slide p,.slide li{font-size:clamp(17px,1.5vw,20px)}
.lead{font-size:clamp(19px,1.8vw,23px)!important;color:var(--soft);max-width:40em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.card{background:var(--bg);border-radius:16px;padding:18px 20px}
.card h3{font-size:22px;margin-bottom:8px}
.card p{margin:0}
.card.foil{background:linear-gradient(135deg,var(--foil),color-mix(in srgb,var(--foil) 60%,var(--paper)) 50%,var(--foil))}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;background:var(--bg);border-radius:14px;padding:14px 16px}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:"Black Han Sans";font-size:22px}
.steps b{display:block}
.note{border-left:5px solid var(--red);background:color-mix(in srgb,var(--red) 8%,var(--paper));padding:12px 16px;border-radius:0 12px 12px 0;margin-top:16px}
.note.g{border-color:var(--g);background:color-mix(in srgb,var(--g) 9%,var(--paper))}
.ex{font-size:14px!important;color:var(--soft);margin:6px 0 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ladder div{background:var(--bg);border-radius:14px;padding:16px;position:relative}
.ladder b{display:block;color:var(--g);font-size:15px}
.ladder strong{font-size:19px}
.prompt{background:var(--bg);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:10px}
.prompt p{margin:0;font-size:17px!important}
.prompt b{color:var(--g);font-size:14px;display:block}
.cp{min-height:44px;padding:6px 16px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font-weight:700;white-space:nowrap}
.cp.done{background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 20px;border-radius:999px;background:var(--g);color:#fff;text-decoration:none;font-weight:700;border:0}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:17px;vertical-align:top}
th{font-size:15px;color:var(--soft)}
.mat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mat div{background:var(--bg);border-radius:14px;padding:14px 16px}
.mat b{display:block;font-size:18px}
.mat span{font-size:15px;color:var(--soft)}
.mat em{font-style:normal;display:inline-block;font-size:13px;font-weight:700;color:var(--g);margin-top:4px}
/* 타이머 */
.timer{background:var(--ink);color:var(--paper);border-radius:18px;padding:20px;text-align:center}
.timer .t{font-family:"Black Han Sans";font-size:clamp(56px,8vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.timer .t.end{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.timer .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.timer button{min-height:44px;padding:6px 16px;border-radius:999px;border:1.5px solid #fff6;background:transparent;color:inherit;font-weight:700}
.timer button.main{background:var(--red);border-color:var(--red);color:#fff}
.timer small{display:block;margin-top:8px;opacity:.75;font-size:14px}
/* 체크리스트 */
.ck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ck label{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:17px}
.ck input{width:24px;height:24px;flex:none;accent-color:var(--g);margin-top:2px}
.ck label:has(input:checked){opacity:.55;text-decoration:line-through}
.bar{height:12px;border-radius:99px;background:var(--foil);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
/* 퀴즈 */
.qz{display:grid;gap:16px}
.q{background:var(--bg);border-radius:16px;padding:16px 18px}
.q h3{font-family:"Noto Sans KR";font-weight:900;font-size:19px;line-height:1.45;margin-bottom:10px}
.q h3 span{color:var(--g)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px}
.opt:hover:not(:disabled){border-color:var(--g)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper));font-weight:700}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.opt:disabled{cursor:default}
.fb{margin:10px 0 0;font-size:16px!important}
.fb b.o{color:var(--ok)}.fb b.x{color:var(--no)}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 18px;font-weight:700}
.score .n{font-family:"Black Han Sans";font-size:34px}
.score button{min-height:44px;border-radius:999px;border:1.5px solid #fff6;background:transparent;color:inherit;padding:6px 16px;font-weight:700}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input{flex:1 1 260px;min-height:48px;font-size:16px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
pre.tpl{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:14px 16px;font:16px/1.7 "Noto Sans KR";margin:0 0 10px}
/* 아래 이동 */
.nav{display:flex;align-items:center;gap:12px}
.nav button{min-height:52px;padding:8px 22px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font-weight:900;font-size:17px}
.nav button:disabled{opacity:.3;cursor:default}
.nav .prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.nav .prog i{display:block;height:100%;background:var(--g);transition:width .3s}
.nav .cnt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--soft);white-space:nowrap}
.cover{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;height:100%}
.cover h1{font-size:clamp(42px,6vw,80px);color:var(--g)}
.cover .who{font-size:18px;color:var(--soft);margin-top:14px}
.big{font-family:"Black Han Sans";font-size:clamp(26px,3vw,38px);line-height:1.25}
.tl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tl ul{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:17px}
.tl li b{color:var(--g);white-space:nowrap;font-variant-numeric:tabular-nums}
body.full .toc,body.full .top{display:none}
body.full .wrap{grid-template-columns:minmax(0,1fr);min-height:100vh}
body.full .stage{min-height:100vh}
.drawerbtn{display:none}.exitfs{display:none}body.full .exitfs{display:inline-flex;background:var(--foil)!important;color:var(--ink)!important}
@media(max-width:900px){
 .wrap{grid-template-columns:minmax(0,1fr)}
 .toc{position:fixed;inset:60px auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-105%);transition:transform .25s;max-height:none;box-shadow:10px 0 40px #0004}
 body.tocopen .toc{transform:none}
 .drawerbtn{display:inline-flex}
 .grid,.mat,.ck,.ladder,.two,.tl,.cover,.hero,.homeinfo{grid-template-columns:minmax(0,1fr)}
 .grid{--n:1!important}
}
@media(max-width:600px){.opts,.picks{grid-template-columns:minmax(0,1fr)}.prompt{grid-template-columns:minmax(0,1fr)}.nav button{padding:8px 16px}.top .brand{font-size:17px}}
</style>
</head>
<body>
<header class="top">
 <button class="brand" id="home" type="button">콜라 판화 성장수업</button>
 <button class="tb icon drawerbtn" id="tocbtn" type="button" aria-label="목차 열기">목차</button>
 <span class="sp"></span>
 <button class="tb" data-go="g2" type="button" aria-pressed="false">2학년</button>
 <button class="tb" data-go="g3" type="button" aria-pressed="false">3학년</button>
 <button class="tb icon" id="fs" type="button" title="전체 화면 (F)">전체 화면</button>
</header>
<main id="app"></main>

<script>
{
const G={
 g2:{k:'g2',gr:'2학년',title:'콜라로 새기는 일상',teacher:'전하영',c:'#1f6f8b',
  sum:'뉴스와 일상 속 사회의 모습을 살펴보고, 내가 살아갈 사회에 대한 생각을 상징 이미지로 새겨 콜라 평판화로 찍어요.',
  goals:['뉴스와 일상 속에서 사회의 모습을 찾아 내 생각을 말할 수 있다.','내가 살아갈 사회에 대한 생각을 상징 이미지로 구상할 수 있다.','콜라 평판화의 원리를 알고 작품을 찍어 패들렛에 공유할 수 있다.']},
 g3:{k:'g3',gr:'3학년',title:'콜라로 새기는 우리의 약속',teacher:'홍지연',c:'#7a3fa0',
  sum:'내가 꿈꾸는 진로를 돌아보고, 그 진로로 사회에 기여하는 모습을 상징 이미지로 새겨 콜라 평판화로 찍어요.',
  goals:['나의 진로를 돌아보고 그것으로 사회에 기여하는 모습을 떠올릴 수 있다.','사회에 대한 나의 약속을 상징 이미지로 구상할 수 있다.','콜라 평판화의 원리를 알고 작품을 찍어 패들렛에 공유할 수 있다.']}
};
const st={view:'home',i:0,quiz:{},ck:{},timer:{left:90,set:90,run:null,end:false}};
const app=document.getElementById('app');
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 그림 ---------- */
const heroSVG=`<svg viewBox="0 0 500 400" role="img" aria-label="은박 판 위에 찍힌 상징 그림과 판화 롤러">
<defs><linearGradient id="fo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".45" stop-color="#b9bcc2"/><stop offset=".6" stop-color="#e9eaed"/><stop offset="1" stop-color="#9da1a8"/></linearGradient>
<linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a2a16"/><stop offset="1" stop-color="#3a1209"/></linearGradient></defs>
<ellipse cx="250" cy="352" rx="210" ry="22" fill="#0002"/>
<g transform="rotate(-6 230 200)"><rect x="70" y="60" width="300" height="270" rx="10" fill="#fff" stroke="#0001"/>
<rect x="92" y="82" width="256" height="226" rx="4" fill="#1c1b19"/>
<g fill="#fff"><circle cx="220" cy="175" r="52"/><path d="M220 230v40M196 270h48" stroke="#fff" stroke-width="12" stroke-linecap="round"/></g>
<path d="M220 140c-22 18-22 52 0 70 22-18 22-52 0-70z" fill="#1c1b19"/><path d="M182 175h76" stroke="#1c1b19" stroke-width="8"/>
<g fill="#fff"><circle cx="130" cy="110" r="6"/><circle cx="312" cy="120" r="4"/><circle cx="300" cy="270" r="7"/></g></g>
<g transform="rotate(14 380 120)"><rect x="300" y="18" width="200" height="150" rx="6" fill="url(#fo)" stroke="#8a8e95" stroke-width="1"/>
<path d="M330 50l40 30-30 40 60 10" stroke="#6b6f76" stroke-width="2" fill="none" opacity=".5"/></g>
<g><rect x="300" y="250" width="150" height="46" rx="23" fill="#2c2b29"/><rect x="306" y="256" width="138" height="34" rx="17" fill="#1a1918"/>
<path d="M375 250v-50h70" stroke="#c8202f" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="430" y="186" width="56" height="28" rx="14" fill="#c8202f"/></g>
<path d="M60 40c0 0-22 30-22 46a22 22 0 0044 0c0-16-22-46-22-46z" fill="url(#cl)"/><circle cx="52" cy="84" r="5" fill="#fff6"/>
</svg>`;
const princSVG=`<svg viewBox="0 0 640 300" role="img" aria-label="콜라 판화 원리 단면도">
<text x="16" y="26" font-size="17" font-weight="700" fill="currentColor">① 크레파스로 그린 부분 = 기름</text>
<text x="360" y="26" font-size="17" font-weight="700" fill="currentColor">② 그림 없는 부분 = 물</text>
<path d="M120 36v34M470 36v40" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="20" y="150" width="600" height="20" rx="3" fill="#b9bcc2"/><rect x="20" y="170" width="600" height="30" fill="#8b6b4a" opacity=".55"/>
<text x="560" y="222" font-size="14" fill="currentColor" text-anchor="end">은박 호일 + 받침판</text>
<rect x="60" y="120" width="120" height="30" rx="8" fill="#1c1b19"/><rect x="240" y="126" width="60" height="24" rx="8" fill="#1c1b19"/>
<g fill="#3aa0d8">${[360,400,440,480,520,560].map((x,i)=>`<path d="M${x} ${150-(i%2)*4}c0 0-12-14-12-22a12 12 0 0024 0c0 8-12 22-12 22z" transform="rotate(180 ${x} ${136-(i%2)*4})"/>`).join('')}</g>

 {p:1,n:'호일 판 만들고 그리기',m:'13분',h:`<h2>호일 판 만들고 그리기<small>스케치를 호일로 옮겨요. 이제부터 판 표면은 손으로 만지지 않아요!</small></h2>

 {p:2,n:'잉크와 롤러',m:'15분',h:`<h2>잉크를 롤러에 묻히기<small>나무젓가락으로 뜨고, PVC 비닐 위에서 펴요.</small></h2>

 {p:2,n:'패들렛 공유',m:'7분',h:`<h2>패들렛에 작품 공유하기<small>손을 깨끗이 씻은 뒤 크롬북을 열어요.</small></h2>

 app.innerHTML=`<div class="wrap"><nav class="toc" aria-label="수업 목차">${toc}</nav><div class="stage">
  <article class="slide" aria-live="polite"><div class="meta">${chip(g.gr+' · '+s.p+'차시',1)}${s.m?chip(s.m):''}</div>${s.h}</article>
  <div class="nav"><button type="button" id="prev" ${st.i===0?'disabled':''}>← 이전</button><div class="prog"><i style="width:${(st.i+1)/SL.length*100}%"></i></div><span class="cnt">${st.i+1} / ${SL.length}</span><button type="button" id="exitfs" class="exitfs">전체 화면 끝</button><button type="button" id="next" ${st.i===SL.length-1?'disabled':''}>다음 →</button></div></div></div>`;
 setBody();updCk();paintTimer();
}
function render(){st.view==='home'?renderHome():renderGrade();window.scrollTo(0,0)}
function go(v,i){st.view=v;st.i=i||0;document.body.classList.remove('tocopen');
 const h=v==='home'?'':(v+(st.i?'-'+(st.i+1):''));try{if(location.hash.slice(1)!==h)history.replaceState(null,'',h?'#'+h:location.pathname)}catch(e){}render()}
function fromHash(){const m=location.hash.match(/^#(g[23])(?:-(\d+))?$/);if(m){st.view=m[1];st.i=Math.max(0,(+m[2]||1)-1);const n=build(m[1]).length;if(st.i>=n)st.i=0}else st.view='home';render()}
function updCk(){const box=document.querySelector('[data-ck]');if(!box)return;const all=box.querySelectorAll('input'),n=[...all].filter(x=>x.checked).length;
 document.getElementById('ckbar').style.width=n/all.length*100+'%';document.getElementById('cktx').textContent=n===all.length?'모두 완료! 깨끗한 미술실, 고마워요.':`${n} / ${all.length} 완료`}

/* ---------- 타이머 ---------- */
let actx=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function paintTimer(){const t=document.getElementById('tm');if(!t)return;const T=st.timer;t.textContent=T.end?'헹궈요!':fmt(T.left);t.classList.toggle('end',T.end);
 const b=document.querySelector('[data-tm=go]');if(b)b.textContent=T.run?'멈춤':'시작'}
function beep(){try{if(!actx)return;[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}
function tick(){const T=st.timer;T.left--;if(T.left<=0){T.left=0;clearInterval(T.run);T.run=null;T.end=true;beep()}paintTimer()}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a');if(!t)return;
 if(t.dataset.go){go(t.dataset.go,0);return}
 if(t.id==='home'){go('home');return}
 if(t.id==='tocbtn'){document.body.classList.toggle('tocopen');return}
 if(t.id==='fs'){const d=document.documentElement;try{if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})}catch(err){}document.body.classList.add('full');if(st.view==='home')go('g2');return}
 if(t.id==='exitfs'){document.body.classList.remove('full');try{document.fullscreenElement&&document.exitFullscreen()}catch(err){}setBody();return}
 if(t.id==='prev'&&st.i>0){go(st.view,st.i-1);return}
 if(t.id==='next'&&st.i<SL.length-1){go(st.view,st.i+1);return}
 if(t.closest('.toc')&&t.dataset.i){go(st.view,+t.dataset.i);return}
 if(t.classList.contains('opt')){const qz=t.closest('[data-quiz]').dataset.quiz;st.quiz[qz][t.dataset.q]=+t.dataset.o;renderGrade();
  const el=document.querySelectorAll(`[data-quiz="${qz}"] .q`)[+t.dataset.q];if(el)el.scrollIntoView({block:'nearest'});return}
 if(t.dataset.reset){st.quiz[t.dataset.reset]={};renderGrade();return}
 if(t.dataset.copy!==undefined){const txt=t.dataset.copy;const lb=t.dataset.lb||(t.dataset.lb=t.textContent);const ok=()=>{t.textContent='복사됨';t.classList.add('done');setTimeout(()=>{t.textContent=lb;t.classList.remove('done')},1600)};
  try{navigator.clipboard.writeText(txt).then(ok,()=>{t.textContent='직접 선택해 복사'})}catch(err){t.textContent='직접 선택해 복사'}return}
 if(t.dataset.pad){const v=document.getElementById('padin').value.trim();if(v&&!/^https?:\/\//.test(v)){document.getElementById('padin').setCustomValidity('https:// 로 시작하는 주소를 넣어 주세요');document.getElementById('padin').reportValidity();return}store.set(t.dataset.pad,v);renderGrade();return}
 if(t.dataset.ts){const T=st.timer;clearInterval(T.run);T.run=null;T.set=T.left=+t.dataset.ts;T.end=false;paintTimer();return}
 if(t.dataset.tm){const T=st.timer;
  if(t.dataset.tm==='reset'){clearInterval(T.run);T.run=null;T.left=T.set;T.end=false}
  else if(T.run){clearInterval(T.run);T.run=null}
  else{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(err){}if(T.left<=0){T.left=T.set;T.end=false}T.run=setInterval(tick,1000)}
  paintTimer();return}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck] input');if(!c)return;const k=c.closest('[data-ck]').dataset.ck;(st.ck[k]=st.ck[k]||[])[+c.dataset.i]=c.checked;updCk()});
document.addEventListener('input',e=>{if(e.target.id==='padin')e.target.setCustomValidity('')});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 if(st.view!=='home'){if(['ArrowRight','PageDown'].includes(e.key)&&st.i<SL.length-1){e.preventDefault();go(st.view,st.i+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)&&st.i>0){e.preventDefault();go(st.view,st.i-1)}}
 if(e.key==='f'||e.key==='F'){document.getElementById('fs').click()}
 if(e.key==='Escape'){document.body.classList.remove('full','tocopen');try{document.fullscreenElement&&document.exitFullscreen()}catch(err){}setBody()}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('full');setBody()}});
window.addEventListener('hashchange',fromHash);
fromHash();
}
</script>
</body>
</html>
